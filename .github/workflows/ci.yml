
name: Job Tracker CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests, coverage and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval
          'db.adminCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: job_tracker_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Lint backend and frontend
        run: npm run lint

      - name: Run backend tests with JSON storage
        env:
          TEST_STORAGE_TYPE: json
        run: npm test --prefix server

      - name: Run backend tests with MongoDB
        env:
          TEST_STORAGE_TYPE: mongodb
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: job_tracker_test
        run: npm test --prefix server

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: job-tracker-coverage
          path: |
            server/coverage/
            client/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build frontend for production
        run: npm run build
